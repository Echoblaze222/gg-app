<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Dark background matching dashboard -->
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#001d3d"/>
      <stop offset="100%" stop-color="#000510"/>
    </radialGradient>

    <!-- Primary blue gradient -->
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#60b4ff"/>
      <stop offset="40%"  stop-color="#007BFF"/>
      <stop offset="100%" stop-color="#0040ff"/>
    </linearGradient>

    <!-- White/silver for text -->
    <linearGradient id="white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#d0e8ff"/>
      <stop offset="100%" stop-color="#90c0ff"/>
    </linearGradient>

    <!-- Blue ring border -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#60b4ff" stop-opacity="0.9"/>
      <stop offset="40%"  stop-color="#007BFF"/>
      <stop offset="100%" stop-color="#003acc" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Shield face dark blue -->
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#002a5c"/>
      <stop offset="100%" stop-color="#000d1f"/>
    </linearGradient>

    <!-- Coin blue -->
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#60b4ff"/>
      <stop offset="100%" stop-color="#0040ff"/>
    </linearGradient>

    <!-- Halo blue glow -->
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#007BFF" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#60b4ff"/>
      <stop offset="70%"  stop-color="#60b4ff"/>
      <stop offset="100%" stop-color="#007BFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Blue glow filter -->
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft glow for text -->
    <filter id="textGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Halo glow -->
    <filter id="haloGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Drop shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#007BFF" flood-opacity="0.25"/>
    </filter>

    <!-- Outer ring glow -->
    <filter id="ringGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <circle cx="300" cy="300" r="298" fill="#000510"/>
  <circle cx="300" cy="300" r="290" fill="url(#bg)"/>

  <!-- ── SUBTLE RAYS ── -->
  <g opacity="0.04" stroke="#007BFF" stroke-width="1">
    <line x1="300" y1="300" x2="300" y2="14"/>
    <line x1="300" y1="300" x2="498" y2="108"/>
    <line x1="300" y1="300" x2="586" y2="300"/>
    <line x1="300" y1="300" x2="498" y2="492"/>
    <line x1="300" y1="300" x2="300" y2="586"/>
    <line x1="300" y1="300" x2="102" y2="492"/>
    <line x1="300" y1="300" x2="14"  y2="300"/>
    <line x1="300" y1="300" x2="102" y2="108"/>
    <line x1="300" y1="300" x2="400" y2="40"/>
    <line x1="300" y1="300" x2="556" y2="196"/>
    <line x1="300" y1="300" x2="556" y2="404"/>
    <line x1="300" y1="300" x2="400" y2="560"/>
    <line x1="300" y1="300" x2="200" y2="560"/>
    <line x1="300" y1="300" x2="44"  y2="404"/>
    <line x1="300" y1="300" x2="44"  y2="196"/>
    <line x1="300" y1="300" x2="200" y2="40"/>
  </g>

  <!-- ── OUTER RING ── -->
  <circle cx="300" cy="300" r="278" fill="none" stroke="url(#ring)" stroke-width="2" filter="url(#ringGlow)" opacity="0.8"/>
  <circle cx="300" cy="300" r="272" fill="none" stroke="rgba(0,123,255,0.2)" stroke-width="1"/>

  <!-- ── BLUE AMBIENT GLOW behind shield ── -->
  <circle cx="300" cy="300" r="180" fill="rgba(0,64,255,0.06)"/>

  <!-- ── MAIN SHIELD ── -->
  <path d="M300 108 L468 162 L468 306 Q468 428 300 500 Q132 428 132 306 L132 162 Z"
    fill="url(#shield)" filter="url(#shadow)"/>

  <!-- Shield outer border -->
  <path d="M300 108 L468 162 L468 306 Q468 428 300 500 Q132 428 132 306 L132 162 Z"
    fill="none" stroke="url(#ring)" stroke-width="3"/>

  <!-- Shield inner glow line -->
  <path d="M300 124 L452 174 L452 306 Q452 416 300 482 Q148 416 148 306 L148 174 Z"
    fill="none" stroke="rgba(96,180,255,0.12)" stroke-width="1.5"/>

  <!-- Blue glow inside shield top -->
  <ellipse cx="300" cy="200" rx="100" ry="60" fill="rgba(0,123,255,0.08)"/>

  <!-- ── HALO ── -->
  <g filter="url(#haloGlow)">
    <ellipse cx="300" cy="96" rx="72" ry="16"
      fill="none" stroke="url(#haloGrad)" stroke-width="5.5"/>
  </g>
  <!-- Halo highlight -->
  <ellipse cx="300" cy="96" rx="72" ry="16"
    fill="none" stroke="rgba(150,210,255,0.4)" stroke-width="2"/>

  <!-- ── DIVIDER LINE ── -->
  <line x1="178" y1="306" x2="422" y2="306"
    stroke="url(#ring)" stroke-width="1" opacity="0.5"/>

  <!-- ── "GG" MONOGRAM ── -->
  <text
    x="300" y="272"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="116"
    font-weight="900"
    fill="url(#white)"
    filter="url(#textGlow)"
    letter-spacing="-5">GG</text>

  <!-- Letter blue outline/glow -->
  <text
    x="300" y="272"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="116"
    font-weight="900"
    fill="none"
    stroke="rgba(96,180,255,0.18)"
    stroke-width="1.5"
    letter-spacing="-5">GG</text>

  <!-- ── COIN STACK (blue) ── -->
  <!-- Coin 3 back -->
  <ellipse cx="300" cy="426" rx="50" ry="13" fill="#000d1f" stroke="rgba(0,123,255,0.4)" stroke-width="1.5"/>
  <rect x="250" y="410" width="100" height="16" fill="#000d1f"/>
  <ellipse cx="300" cy="410" rx="50" ry="13" fill="url(#coin)" opacity="0.3"/>

  <!-- Coin 2 mid -->
  <ellipse cx="300" cy="414" rx="50" ry="13" fill="#000d1f" stroke="rgba(0,123,255,0.6)" stroke-width="1.5"/>
  <rect x="250" y="398" width="100" height="16" fill="#000d1f"/>
  <ellipse cx="300" cy="398" rx="50" ry="13" fill="url(#coin)" opacity="0.55"/>

  <!-- Coin 1 top -->
  <ellipse cx="300" cy="402" rx="50" ry="13" fill="#000d1f" stroke="#007BFF" stroke-width="2"/>
  <rect x="250" y="386" width="100" height="16" fill="#000d1f"/>
  <ellipse cx="300" cy="386" rx="50" ry="13" fill="url(#coin)"/>
  <!-- Naira sign -->
  <text x="300" y="391" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="rgba(255,255,255,0.8)">₦</text>
  <!-- Coin shine -->
  <ellipse cx="286" cy="383" rx="16" ry="4" fill="rgba(150,210,255,0.2)" transform="rotate(-10 286 383)"/>

  <!-- ── DIAMOND ACCENTS ── -->
  <g fill="url(#blue)" filter="url(#blueGlow)" opacity="0.9">
    <polygon points="300,22  307,36 300,32 293,36"/>
    <polygon points="300,578 307,564 300,568 293,564"/>
    <polygon points="22,300  36,293 32,300 36,307"/>
    <polygon points="578,300 564,293 568,300 564,307"/>
  </g>

  <!-- Small side dots -->
  <circle cx="300" cy="28"  r="3" fill="#007BFF" opacity="0.6"/>
  <circle cx="300" cy="572" r="3" fill="#007BFF" opacity="0.6"/>
  <circle cx="28"  cy="300" r="3" fill="#007BFF" opacity="0.6"/>
  <circle cx="572" cy="300" r="3" fill="#007BFF" opacity="0.6"/>

  <!-- ── BOTTOM TEXT BAND ── -->
  <rect x="110" y="514" width="380" height="54" rx="10"
    fill="rgba(0,10,30,0.7)"
    stroke="rgba(0,123,255,0.4)" stroke-width="1"/>

  <!-- Side lines -->
  <line x1="118" y1="541" x2="164" y2="541" stroke="url(#ring)" stroke-width="0.8" opacity="0.6"/>
  <line x1="436" y1="541" x2="482" y2="541" stroke="url(#ring)" stroke-width="0.8" opacity="0.6"/>

  <text x="300" y="531"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14" font-weight="700" letter-spacing="5"
    fill="url(#white)" text-anchor="middle" dominant-baseline="middle">
    GOD'S GRACE
  </text>
  <text x="300" y="554"
    font-family="Arial, Helvetica, sans-serif"
    font-size="9.5" letter-spacing="4.5"
    fill="rgba(96,180,255,0.75)" text-anchor="middle" dominant-baseline="middle">
    FINTECH · THRIFT &amp; AJO
  </text>

  <!-- ── TOP SPARKLE ACCENTS ── -->
  <g fill="#007BFF" filter="url(#blueGlow)" opacity="0.7">
    <polygon points="180,80 183,73 186,80 183,77"/>
    <polygon points="420,80 423,73 426,80 423,77"/>
    <polygon points="120,200 123,193 126,200 123,197"/>
    <polygon points="474,200 477,193 480,200 477,197"/>
  </g>
</svg>
